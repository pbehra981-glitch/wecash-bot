name: WeCash Screenshot Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install chromium
          playwright install-deps

      - name: Run Bot Script
        run: |
          python -u main.py

      # YE NYA STEP ADD KAREIN TAAKI SCREENSHOTS DOWNLOAD KAR SAKEIN
      - name: Upload Screenshots as Artifact
        if: always()  # Chahe script pass ho ya fail, screenshots upload honge
        uses: actions/upload-artifact@v3
        with:
          name: bot-screenshots
          path: bot_screenshots/
          retention-days: 1  # Artifact sirf 1 din tak save rahega
